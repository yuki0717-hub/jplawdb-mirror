source_base: "https://jplawdb.github.io/html-preview"
mirror_base: "https://yuki0717-hub.github.io/jplawdb-mirror"
output_dir: "output"

concurrency: 16
delay_sec: 0.05
max_retries: 4
timeout_sec: 60
max_file_bytes: 25000000

egov:
  api_base: "https://laws.e-gov.go.jp/api/2"
  as_of: "current"
  concurrency: 4
  minimum_articles: 5000
  laws:
    shotokuzei:
      title: "所得税法"
      type: "Act"
    shotokuzei_seirei:
      title: "所得税法施行令"
      type: "CabinetOrder"
    shotokuzei_kisoku:
      title: "所得税法施行規則"
      type: "MinisterialOrdinance"
    hojinzei:
      title: "法人税法"
      type: "Act"
