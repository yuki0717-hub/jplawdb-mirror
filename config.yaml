      title: "法人税法施行令"
      type: "CabinetOrder"
    hojinzei_kisoku:
      title: "法人税法施行規則"
      type: "MinisterialOrdinance"
    shohizei:
      title: "消費税法"
      type: "Act"
    shohizei_seirei:
      title: "消費税法施行令"
      type: "CabinetOrder"
    shohizei_kisoku:
      title: "消費税法施行規則"
      type: "MinisterialOrdinance"
    sozokuzei:
      title: "相続税法"
      type: "Act"
    sozokuzei_seirei:
      title: "相続税法施行令"
      type: "CabinetOrder"
    sozokuzei_kisoku:
      title: "相続税法施行規則"
      type: "MinisterialOrdinance"
    kokuzei_tsusoku:
      title: "国税通則法"
      type: "Act"
    kokuzei_tsusoku_seirei:
      title: "国税通則法施行令"
      type: "CabinetOrder"
    kokuzei_tsusoku_kisoku:
      title: "国税通則法施行規則"
      type: "MinisterialOrdinance"
    sozei_tokubetsu:
      title: "租税特別措置法"
      type: "Act"
    sozei_tokubetsu_seirei:
      title: "租税特別措置法施行令"
